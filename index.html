 function next(){if(i>=roles.length)return Promise.resolve(null);var r=roles[i++];return unwrap(raw,r).then(function(c){return c?{cek:c,role:r}:next()})}
 return next();
}
function save(raw,role,remember){var t=JSON.stringify({r:role,k:b64e(raw)});try{sessionStorage.setItem(TK,t);if(remember)localStorage.setItem(TK,t)}catch(e){}}
function clearTok(){try{sessionStorage.removeItem(TK);localStorage.removeItem(TK)}catch(e){}}
if(!(window.crypto&&crypto.subtle)){$('err').textContent='Este navegador no soporta el acceso seguro (requiere HTTPS).';$('go').disabled=true;return}
/* sesión / dispositivo recordado */
var tok=null;try{tok=sessionStorage.getItem(TK)||localStorage.getItem(TK)}catch(e){}
if(tok){try{var o=JSON.parse(tok);var raw=b64(o.k);
 unwrap(raw,o.r).then(function(c){if(c)return openApp(c,o.r);clearTok()}).catch(clearTok)}catch(e){clearTok()}}
$('f').addEventListener('submit',function(ev){
 ev.preventDefault();var pw=$('pw').value;if(!pw)return;
 var fails=+(sessionStorage.getItem('taximetro_fail')||0),delay=Math.min(8,fails)*1000;
 $('go').disabled=true;$('err').textContent='Verificando…';
 var t0=Date.now();
 /* los dos roles usan salts distintos: se prueba cada uno */
 var roles=['owner','tester'],i=0,found=null;
 function step(){
  if(i>=roles.length||found)return fin();
  var r=roles[i++];
  derive(pw,b64(G.w[r].salt)).then(function(raw){return unwrap(raw,r).then(function(c){if(c){found={cek:c,role:r,raw:raw}}step()})});
 }
 function fin(){
  var wait=Math.max(0,delay-(Date.now()-t0));
  setTimeout(function(){
   if(found){sessionStorage.removeItem('taximetro_fail');save(found.raw,found.role,$('rem').checked);openApp(found.cek,found.role).catch(function(){$('err').textContent='Error al abrir la aplicación.';$('go').disabled=false})}
   else{sessionStorage.setItem('taximetro_fail',String(fails+1));$('err').textContent='Contraseña incorrecta.';$('pw').value='';$('go').disabled=false;$('pw').focus()}
  },wait);
 }
 step();
});
})();
</script>
